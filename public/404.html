<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Eternal Techworks | Page Redirecting...</title>
    <script>
      // Single Page Application router redirect script for static hosts (GitHub Pages / IIS)
      (function() {
        var pathSegmentsToKeep = 0;
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
          (l.search ? '&' + l.search.slice(1) : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to requested page... If not redirected automatically, <a href="/">click here to return to Eternal Techworks homepage</a>.</p>
  </body>
</html>
